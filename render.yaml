services:
  - type: web
    name: mebel360-hisobchi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server_app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
